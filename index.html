/* Cute classroom theme redesign */
:root{
  --cute-pink:#f7b6c8;
  --cute-blue:#b9e8f7;
  --cute-green:#bde89b;
  --cream:#fff9ef;
}
body{background:var(--cream);}
.site-header{background:linear-gradient(90deg,#8ed8c5,#f6b6c9);color:#334155}
.brand small{color:#52636d}
.brand-mark{background:#fff;color:#7c5a7c}
.intro{
 background:
 linear-gradient(135deg,rgba(255,250,240,.96),rgba(235,250,245,.96)),
 url("cute-bg.jpg") center/cover;
 color:#334155;
}
.intro p{color:#52636d}
.intro h1{color:#5b486b}
.hero-figure{
 background:#ffffffaa;
 border-color:#f3c6d4;
 box-shadow:0 15px 35px #d89aaa33;
}
.hero-figure strong{color:#72a85d}
.panel,.identity-card,.action-bar,.result,.admin-intro,.admin-stat{
 border-radius:26px;
 border-color:#f1d9df;
 box-shadow:0 10px 30px rgba(180,130,150,.14);
}
.panel-head{background:#fffdf8}
.drop-zone{
 border-color:#d9c5e9;
 background:#fff8fd;
}
.drop-zone.over,.drop-zone:hover{border-color:#f09abb;background:#fff0f6}
.formula-card{
 border-radius:18px;
 background:#fffdfb;
}
.formula-card:hover{border-color:#9ddbb8}
.primary{background:linear-gradient(135deg,#f08fb1,#a9d98b);color:#fff}
.progress-ring{background:conic-gradient(#f08fb1 var(--progress,0%),#eee6e8 0)}
.question .number{background:#ffe4ee;color:#9b5672}
.footer{background:#fff7f0}

body{background:linear-gradient(180deg,#fff3fb 0%,#f0fbff 45%,#fffbea 100%);}
